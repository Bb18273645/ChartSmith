name: astrbot_plugin_chartsmith
display_name: 图匠 ChartSmith
desc: |
  让 AI 把流程、架构、调用链画成一张排版好的图片，直接发到 QQ / Telegram / 飞书里，而不是一堆文字。

  模型只给节点和连线，插件负责分层排版、正交走线，用 Pillow 在本地渲染成 PNG：零额外依赖、离线可用、不经过第三方渲染服务。
  支持自动挑选上下/左右方向、2 倍像素输出、emoji 清洗、按会话限流与按内容缓存。
short_desc: 结构化内容 → 排版好的图
version: "0.2.0"
author: Bb18273645
repo: https://github.com/Bb18273645/ChartSmith
social_link: https://github.com/Bb18273645
astrbot_version: ">=4.29,<5"
support_platforms:
  - aiocqhttp
  - telegram
  - lark
  - discord
  - wecom
tags:
  - 流程图
  - 架构图
  - 可视化
  - diagram
  - flowchart
